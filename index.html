<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fractal Studio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #aaaaaa;
    }
    a.button {
      background: #4a90e2;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.3s ease;
    }
    a.button:hover {
      background: #357ab8;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>🎨 Fractal Studio</h1>
  <p>Create stunning fractals with one click.</p>
  <a href="FractalStudio.exe" class="button">Download for Windows</a>
  <footer>
    Made by Alex with ❤️ and Python
  </footer>
</body>
</html>
